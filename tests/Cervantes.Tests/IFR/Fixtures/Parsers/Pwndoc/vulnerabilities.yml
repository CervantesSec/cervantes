- cvssv3: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N'
  priority: 3
  remediationComplexity: 2
  details:
    - locale: EN
      title: Stored Cross-Site Scripting
      vulnType: Injection
      description: >-
        <p>User input is stored and later written to pages without being
        encoded.</p>
      observation: >-
        <p>The comment field of the support form accepts and stores
        script.</p>
      remediation: <p>Encode output for the context it is written to.</p>
      references:
        - https://owasp.org/www-community/attacks/xss/
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      customFields: []
    - locale: FR
      title: Cross-Site Scripting stocké
      vulnType: Injection
      description: <p>Les entrées utilisateur sont stockées puis affichées sans encodage.</p>
      observation: <p>Le champ commentaire accepte et stocke du script.</p>
      remediation: <p>Encoder les sorties selon leur contexte.</p>
      references: []
      customFields: []
  category: Web Application
